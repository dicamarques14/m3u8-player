<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧪 Experimental Player 🧪</title>

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css"
    integrity="sha384-/Y6pD6FV/Vv2HJnA6t+vslU6fwYXjCFtcEpHbNJ0lyAFsXTsjBbfaDjzALeQsN6M" crossorigin="anonymous">
  <link rel="stylesheet" href="../shared/common.css">
  <!-- Classic script (not a module) so it runs before player.js and exposes the CMP global to it -->
  <script src="../shared/link-params.js"></script>

  <style>
    body,
    html {
      margin: 0;
    }

    #canvas-wrap {
      position: relative;
      width: 100%;
      height: calc(100% - 60px);
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #canvas {
      max-width: 100%;
      max-height: 100%;
    }

    #status {
      color: #0f0;
      background: rgba(0, 0, 0, 0.6);
      font: 12px monospace;
      padding: 4px 8px;
      white-space: pre-wrap;
      max-height: 40vh;
      overflow-y: auto;
    }

    #play-btn {
      position: absolute;
    }

    #bottom-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
    }

    #controls {
      display: none;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.6);
    }

    #progress-bar-container {
      position: relative;
      height: 8px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      cursor: pointer;
      touch-action: none;
    }

    #progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: #ff8c00;
      border-radius: 4px;
    }

    #controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      color: #fff;
      font: 12px monospace;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark position-relative">
    <a href="../" class="btn btn-outline-light" id="home-btn">⬅️</a>
    <span class="navbar-brand mb-0 h1 center-abs">🧪 Experimental Player 🧪</span>
  </nav>

  <div id="canvas-wrap">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <button id="play-btn" class="btn btn-lg btn-outline-light">▶️ Play</button>

    <div id="bottom-overlay">
      <div id="controls">
        <div id="progress-bar-container">
          <div id="progress-bar"></div>
        </div>
        <div id="controls-row">
          <button id="play-pause-btn" class="btn btn-sm btn-outline-light">▶</button>
          <span id="time-label">0:00 / 0:00</span>
        </div>
      </div>
      <div id="status">Idle.</div>
    </div>
  </div>

  <script type="module" src="player.js"></script>
</body>

</html>
