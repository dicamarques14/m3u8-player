<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🦄 Unicorn Player 🦄</title>

  <script src="https://code.jquery.com/jquery-3.2.1.min.js"
    integrity="sha256-hwg4gsxgFZhOsEEamdOYGBf13FyQuiTwlAQgxVSNgt4=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="mousetrap.min.js" charset="utf-8"></script>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css"
    integrity="sha384-/Y6pD6FV/Vv2HJnA6t+vslU6fwYXjCFtcEpHbNJ0lyAFsXTsjBbfaDjzALeQsN6M" crossorigin="anonymous">

  <style>
    /* Set body and html to take up full height */
    body,
    html {
      height: 100%;
      margin: 0;
    }

    /* Set navbar height and make video take up the rest */
    .navbar {
      height: 60px;
    }

    #video {
      display: block;
      width: 100%;
      height: calc(100% - 60px);
      /* Subtract the navbar height */
    }

    /* Ensure the share button stays on the right */
    .navbar .share-btn {
      margin-left: auto;
    }

    @keyframes unicorn-rgb-hue {
      from {
        filter: hue-rotate(0deg) saturate(1.45) brightness(1.05);
      }

      to {
        filter: hue-rotate(360deg) saturate(1.45) brightness(1.05);
      }
    }

    .unicorn-rgb {
      display: inline-block;
      animation: unicorn-rgb-hue 4s linear infinite;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <!-- Home button on the left -->
    <a href="../" class="btn btn-outline-light">⬅️</a>

    <!-- Center the title using mx-auto -->
    <span class="navbar-brand mb-0 h1 mx-auto"><span class="unicorn-rgb">🦄</span> Unicorn Player <span
        class="unicorn-rgb">🦄</span></span>

    <!-- Share button on the right with ml-auto -->
    <button class="btn btn-outline-light ml-auto" id="share-btn">🔗</button>
  </nav>

  <video id="video" controls=""></video>

  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/js/bootstrap.min.js"
    integrity="sha384-h0AbiXch4ZDo7tp9hKZ4TsHbi047NrKGLO3SEJAg45jXxnGIfYzk4Si90RDIqNm1"
    crossorigin="anonymous"></script>
  <script src="player.js"></script>
  <script>

  </script>
</body>

</html>
