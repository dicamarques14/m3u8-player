<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>🦄 Unicorn Player 🦄</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    crossorigin="anonymous">
  <link rel="stylesheet" href="../shared/common.css">
  <!-- Classic script (not a module) so it runs before player.js and exposes the CMP global to it -->
  <script src="../shared/link-params.js"></script>

  <style>
    body,
    html {
      margin: 0;
    }

    #player-container {
      position: relative;
      width: 100%;
      height: calc(100% - 60px);
      /* Subtract the navbar height */
      background: #000;
    }

    movi-player {
      display: block;
      width: 100%;
      height: 100%;
    }

    #player-error {
      display: none;
      position: absolute;
      left: 8px;
      right: 8px;
      top: 8px;
      z-index: 10;
      padding: 8px 12px;
      border-radius: 6px;
      background: rgba(180, 30, 30, 0.9);
      color: #fff;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark position-relative">
    <!-- Home button on the left; player.ts appends ?u=<source url> so it reopens the picker -->
    <a href="../" class="btn btn-outline-light" id="home-btn">⬅️</a>

    <!-- Absolutely centered so side buttons' widths don't skew it -->
    <span class="navbar-brand mb-0 h1 center-abs"><span class="unicorn-rgb">🦄</span> Unicorn Player <span
        class="unicorn-rgb">🦄</span></span>

    <!-- Right-side buttons -->
    <div class="ml-auto d-flex align-items-center">
      <button class="btn btn-outline-light mr-2" id="engine-btn">🎞️</button>
      <button class="btn btn-outline-light" id="original-btn" style="display:none;">🌐</button>
      <button class="btn btn-outline-light ml-2" id="share-btn">🔗</button>
    </div>
  </nav>

  <!-- <movi-player> is created and mounted here by player.ts (after the engine has registered it) -->
  <div id="player-container">
    <div id="player-error"></div>
  </div>

  <script type="module" src="player.js"></script>
</body>

</html>
