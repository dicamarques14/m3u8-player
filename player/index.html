<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🦄 Unicorn Player 🦄</title>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17"></script>
  <script src="mousetrap.min.js" charset="utf-8"></script>
  <script src="../shared/link-params.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    crossorigin="anonymous">
  <link rel="stylesheet" href="../shared/common.css">

  <style>
    body,
    html {
      margin: 0;
    }

    #video {
      display: block;
      width: 100%;
      height: calc(100% - 60px);
      /* Subtract the navbar height */
    }

    /* Ensure the share button stays on the right */
    .navbar .share-btn {
      margin-left: auto;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark position-relative">
    <!-- Home button on the left; player.js appends ?u=<source url> so it reopens the picker -->
    <a href="../" class="btn btn-outline-light" id="home-btn">⬅️</a>

    <!-- Absolutely centered so side buttons' widths don't skew it -->
    <span class="navbar-brand mb-0 h1 center-abs"><span class="unicorn-rgb">🦄</span> Unicorn Player <span
        class="unicorn-rgb">🦄</span></span>

    <!-- Right-side buttons -->
    <div class="ml-auto d-flex align-items-center">
      <button class="btn btn-outline-light" id="original-btn" style="display:none;">🌐</button>
      <button class="btn btn-outline-light ml-2" id="share-btn">🔗</button>
    </div>
  </nav>

  <video class="bg-dark" id="video" controls=""></video>

  <!-- Bootstrap 4's JS plugins (dropdown/tooltip/popover) hard-require Popper at load time; the
       modal/alert/close used here don't need it, but omitting it throws in the console anyway. -->
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
    crossorigin="anonymous"></script>
  <script src="player.js"></script>
</body>

</html>
