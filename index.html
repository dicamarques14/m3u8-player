<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json" />
    <title>🦄 Unicorn Player 🦄</title>
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"
        integrity="sha256-hwg4gsxgFZhOsEEamdOYGBf13FyQuiTwlAQgxVSNgt4=" crossorigin="anonymous"></script>
    <script type="text/javascript" src="https://unpkg.com/popper.js@1.12.3"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css"
        integrity="sha384-/Y6pD6FV/Vv2HJnA6t+vslU6fwYXjCFtcEpHbNJ0lyAFsXTsjBbfaDjzALeQsN6M" crossorigin="anonymous">
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/js/bootstrap.min.js"
        integrity="sha384-h0AbiXch4ZDo7tp9hKZ4TsHbi047NrKGLO3SEJAg45jXxnGIfYzk4Si90RDIqNm1"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="shared/common.css">
    <script type="text/javascript" src="shared/link-params.js"></script>
    <script type="text/javascript" src="main.js"></script>
    <script>navigator.serviceWorker.register("service-worker.js")</script>
    <style>
        #text-box {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .input-group {
            width: 100%;
            max-width: 500px;
        }

        .page-name {
            margin: 0.5em 2.5em;
            color: rgb(18, 96, 101);
            font-size: 2.5em;
        }

        #alert-box {
            display: none;
            /* Initially hidden */
            margin-top: 1em;
        }

        #build-stamp {
            position: fixed;
            right: 0.5em;
            bottom: 0.4em;
            opacity: 0.5;
        }

        #picker-list {
            max-height: 60vh;
            overflow-y: auto;
        }

        /* Rows are divs (they can contain their own ✕ button), so restore button affordances. */
        .picker-row {
            text-align: left;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container h-100">
        <div class="row h-100 justify-content-center align-items-center">
            <div class="col-12" id="text-box">
                <div class="text-center w-100">
                    <h2 class="page-name">🏴‍☠️🐎Clip My Pony Player🐎🏴‍☠️</h2>
                    <h3 class="page-name"><span class="unicorn-rgb">🦄</span>Unicorn Edition<span
                            class="unicorn-rgb">🦄</span></h3>
                    <!-- Alert section -->
                    <div class="alert alert-danger alert-dismissible fade show" id="alert-box" role="alert">
                        <span id="alert-message">Please enter a valid M3U8 or CMH link.</span>
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="mx-auto" style="max-width: 500px;">
                        <input type="text" class="form-control mb-2" placeholder="Paste the m3u8 link here"
                            id="m3u8-placeholder">
                        <div class="btn-group d-flex" role="group">
                            <button class="btn btn-secondary flex-fill" type="button" id="history-btn"
                                title="Recent links">🕘</button>
                            <button class="btn btn-secondary flex-fill" type="button" id="paste-btn">Paste</button>
                            <button class="btn btn-success flex-fill" type="button" id="play-btn">Play</button>
                            <button class="btn btn-warning flex-fill" type="button" id="play-exp-btn">🧪 Exp.
                                Player</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Deploy stamp: the CI workflow rewrites __BUILD__ with the short commit sha. Left as the
         literal placeholder when served locally, and hidden by main.js in that case. -->
    <small class="text-muted" id="build-stamp">__BUILD__</small>

    <!-- Picker: event competitions, or a competition's horse/rider list -->
    <div class="modal fade" id="picker-modal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="picker-title">Pick</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <input type="text" class="form-control mb-2" id="picker-filter" placeholder="Filter…">
                    <div class="list-group" id="picker-list"></div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
