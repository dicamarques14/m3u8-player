<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json" />
    <title>🦄 Unicorn Player 🦄</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="shared/common.css">
    <script type="text/javascript" src="shared/link-params.js"></script>
    <script type="text/javascript" src="main.js"></script>
    <script>
        // The service worker's stale-while-revalidate was the source of the double-refresh-to-see-
        // changes behavior; unregister it (and drop its cache) for anyone who already has it installed.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (reg) { reg.unregister(); });
            });
            if ('caches' in window) {
                caches.delete('pwa-cache');
            }
        }
    </script>
    <style>
        /* Rainbow background: https://www.joshwcomeau.com/react/rainbow-button/ — a diagonal,
           corner-to-corner gradient that cycles hue so the colors keep moving. */
        body {
            background: #14171a;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(135deg,
                    #ff2400, #e81d8c, #7b2ff7, #00c2ff, #00e0a8, #a8ff00, #ffb700, #ff2400);
            filter: saturate(1.4);
            animation: rainbow-hue 14s linear infinite;
        }

        @keyframes rainbow-hue {
            to {
                filter: saturate(1.4) hue-rotate(360deg);
            }
        }

        /* Glass card so the h2/h3/form stay legible over whatever hue is behind them. */
        #text-box>.text-center {
            background: rgba(20, 23, 26, 0.55);
            backdrop-filter: blur(10px);
            border-radius: 1.5em;
            padding: 1.5em 1em;
        }

        #text-box {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .input-group {
            width: 100%;
            max-width: 500px;
        }

        .page-name {
            margin: 0.5em 2.5em;
            color: rgb(18, 96, 101);
            font-size: 2.5em;
        }

        #alert-box {
            display: none;
            /* Initially hidden */
            margin-top: 1em;
        }

        #action-buttons>.btn+.btn {
            margin-left: 0.5em;
        }

        #build-stamp {
            position: fixed;
            right: 0.5em;
            bottom: 0.4em;
            opacity: 0.5;
        }

        #picker-list {
            max-height: 60vh;
            overflow-y: auto;
        }

        /* Rows are divs (they can contain their own ✕ button), so restore button affordances. */
        .picker-row {
            text-align: left;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container h-100">
        <div class="row h-100 justify-content-center align-items-center">
            <div class="col-12" id="text-box">
                <div class="text-center w-100">
                    <h2 class="page-name">🏴‍☠️🐎Clip My Pony Player🐎🏴‍☠️</h2>
                    <h3 class="page-name"><span class="unicorn-rgb">🦄</span>Unicorn Edition<span
                            class="unicorn-rgb">🦄</span></h3>
                    <!-- Alert section -->
                    <div class="alert alert-danger alert-dismissible fade show" id="alert-box" role="alert">
                        <span id="alert-message">Please enter a valid M3U8 or CMH link.</span>
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="mx-auto" style="max-width: 500px;">
                        <input type="text" class="form-control mb-2" placeholder="Paste the m3u8 link here"
                            id="m3u8-placeholder">
                        <div class="d-flex justify-content-center" id="action-buttons">
                            <button class="btn btn-secondary flex-fill" type="button" id="history-btn"
                                title="History with recent links">History</button>
                            <button class="btn btn-info flex-fill" type="button" id="paste-btn"
                                title="Paste URL in clipboard">Paste</button>
                            <button class="btn btn-warning flex-fill" type="button" id="play-exp-btn" 
                                title="Parse and Play on experimental">🧪 Exp.
                                Player</button>
                            <button class="btn btn-success flex-fill" type="button" id="play-btn" 
                                title="Parse and Play">Play</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Deploy stamp: the CI workflow rewrites __BUILD__ with the short commit sha. Left as the
         literal placeholder when served locally, and hidden by main.js in that case. -->
    <small class="text-muted" id="build-stamp">__BUILD__</small>

    <!-- Picker: event competitions, or a competition's horse/rider list -->
    <div class="modal fade" id="picker-modal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="picker-title">Pick</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <input type="text" class="form-control mb-2" id="picker-filter" placeholder="Filter…">
                    <div class="list-group" id="picker-list"></div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
